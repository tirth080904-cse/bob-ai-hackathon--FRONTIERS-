submission:
  title: "R.E.A.C.T. - Resilient Engine for Adaptive Cargo and Transport"

  problem_statement: >
    Global and India-focused supply chains face frequent, high-impact disruptions
    including port closures, geopolitical route blockages (e.g. Suez Canal), and
    carrier shortages that operators currently manage reactively and in silos. There
    is no single interface that simultaneously shows which active shipments are
    exposed, which fleet assets are available to redeploy, whether perishable or
    pharma cargo is still within safe temperature ranges, and what alternative routes
    are feasible for each cargo type. The result is costly delays, spoiled cargo, and
    decisions made without full situational awareness.

  solution_summary: >
    R.E.A.C.T. is a single-page, browser-based supply-chain control tower for India
    operations. It combines four analytical engines covering disruption detection,
    cargo-aware route optimisation, fleet utilisation, and cold-chain temperature
    monitoring, surfaced through six dedicated screens and a live Leaflet map, with a
    conversational Guardian AI assistant that operators can query in plain English. All
    logic runs client-side in HTML/CSS/JavaScript and is also available as a standalone
    Python CLI backed by four Python modules and structured data files.

  key_features:
    - "Disruption Monitor: scans active shipments and classifies each as Affected or Safe based on route corridor match (Suez Canal, Strait of Malacca, Pacific, Atlantic, Arabian Sea)"
    - "Cargo-aware Route Optimizer: recommends alternative routes tailored to cargo type (perishable gets air-freight first, hazardous gets certified corridors, universal fallbacks always appended)"
    - "Fleet Optimizer: identifies idle fleet assets and matches each to affected shipments by cargo-type compatibility (suitable_for vs cargo_type)"
    - "Cold-Chain Monitor: classifies sensor readings as NORMAL / WARNING / CRITICAL using a 3-degree-C breach threshold for vaccines, frozen seafood, fresh produce, blood samples, and industrial chemicals"
    - "Guardian AI chat assistant: client-side keyword engine answering plain-English queries about shipments, fleet, routes, and cold-chain; switches active disruption zone on command"

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: []
    ibm_technologies: []
    databases: []
    other: ["Leaflet.js 1.9.4", "OpenStreetMap", "Google Fonts"]

  what_we_are_most_proud_of: >
    The end-to-end connected pipeline in a single view: a single disruption event
    cascades instantly through all four analytical layers. Operators see which
    shipments are exposed, which feasible alternative routes exist per cargo type,
    which idle fleet assets at Indian depots (JNPT, Chennai, Cochin, Mundra, Kolkata)
    can be redeployed, and whether any perishable cargo has already breached safe
    temperature thresholds - all without switching screens. That chain of reasoning
    (disruption to exposure to route to fleet to cold-chain) is fully wired in both
    the browser dashboard and the Python CLI.

  known_limitations: >
    Guardian AI is a client-side keyword matcher with no IBM Bob or watsonx.ai
    integration - real LLM integration is the top-priority next step. All shipment,
    fleet, and sensor data is hardcoded (no live AIS feed or database). The login
    screen is cosmetic with no real session management. Route data covers four global
    sea corridors only; Indian coastal and road-freight routes are not yet modelled.

